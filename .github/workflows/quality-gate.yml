name: Quality Gate

on:
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality-gate.ps1